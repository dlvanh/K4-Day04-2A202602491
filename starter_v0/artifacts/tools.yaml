tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi bổ sung thông tin từ người dùng khi thiếu thông tin bắt buộc (như mã máy, mã nhân viên), khi môi trường/thông tin mơ hồ, hoặc xin xác nhận trước khi thực hiện hành động ghi (như tạo ticket)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi gửi tới người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi mong đợi: 'yes_no' khi xin xác nhận tạo ticket hoặc thay đổi trạng thái; 'choice' khi cần chọn giữa các tùy chọn cụ thể (ví dụ giữa production và staging); 'text' khi cần người dùng cung cấp thông tin tự do (như mã thiết bị, mã nhân viên)."}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách các lựa chọn khi response_type là 'choice' (ví dụ ['production', 'staging'])"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật và bài viết khắc phục sự cố trong kho tri thức (Knowledge Base) nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung hoặc từ khóa cần tìm kiếm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn cụ thể. BẮT BUỘC chọn category phù hợp nhất với chủ đề: 'email' cho Outlook/hòm thư điện tử, 'vpn' cho VPN/kết nối từ xa, 'wifi' cho Wi-Fi/mạng không dây, 'printing' cho máy in, 'account' cho tài khoản/mật khẩu, 'hardware' cho phần cứng, 'software' cho phần mềm."}
        top_k: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái vận hành của một dịch vụ dùng chung trong toàn công ty (VPN, Email, SSO, Wi-Fi, Printing). CHỈ DÙNG khi người dùng hỏi về trạng thái dịch vụ chung của công ty. KHÔNG dùng khi người dùng chỉ yêu cầu kiểm tra một thiết bị cá nhân/laptop cụ thể."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ dùng chung cần kiểm tra"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường dịch vụ: 'production' hoặc 'staging'. Nếu người dùng đề cập môi trường cụ thể, bắt buộc truyền đúng môi trường đó, không tự ý chuyển thành production."}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin tài sản và chẩn đoán kỹ thuật của một thiết bị cụ thể theo mã tài sản (asset_id). Khi người dùng yêu cầu kiểm tra một thiết bị cụ thể (kể cả kiểm tra tổng thể với check='all'), chỉ dùng duy nhất tool này mà không gọi kèm check_service_status."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản cụ thể của thiết bị (ví dụ LT-204, DT-031). TUYỆT ĐỐI KHÔNG truyền các chuỗi giữ chỗ như 'LT-xxx', 'unknown' hoặc 'laptop'; nếu người dùng chưa cung cấp mã tài sản cụ thể, BẮT BUỘC phải dùng clarify(response_type='text') để hỏi lại."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm chẩn đoán cần kiểm tra: 'vpn' (kết nối VPN, client VPN, chứng chỉ VPN certificate của máy), 'network' (mạng/Wi-Fi/latency), 'security' (bảo mật/mã hóa đĩa FileVault/endpoint agent), 'hardware' (phần cứng/pin/ổ cứng/RAM), 'software' (hệ điều hành/ứng dụng), hoặc 'all' (kiểm tra toàn bộ/tổng thể thiết bị). Nếu yêu cầu liên quan cụ thể đến VPN hoặc chứng chỉ VPN, bắt buộc chọn 'vpn'."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên và danh sách thiết bị được cấp phát trong danh bạ nội bộ theo mã định danh nhân viên (employee_id)."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã định danh nhân viên theo đúng định dạng EMP-xxxx (ví dụ EMP-1001, EMP-1003). TUYỆT ĐỐI KHÔNG truyền tên phòng ban (như 'Sales', 'IT') hoặc tên người; nếu thiếu mã EMP-xxxx cụ thể, bắt buộc dùng clarify để hỏi lại."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã thu thập thành báo cáo sự cố kỹ thuật. Dùng khi người dùng yêu cầu định dạng findings có sẵn và không cần kiểm tra lại."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo: brief, technical, hoặc handoff"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề báo cáo sự cố"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket sự cố hỗ trợ kỹ thuật. CHỈ ĐƯỢC GỌI sau khi người dùng đã xác nhận đồng ý rõ ràng (sau khi đã hỏi qua clarify response_type='yes_no'). Nếu chưa có xác nhận hoặc thông tin ticket vừa bị thay đổi, phải dùng clarify để hỏi lại, tuyệt đối không tự ý gọi tool này."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố cần tạo ticket"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên của sự cố"}
        asset_id: {type: string, default: "", description: "Mã tài sản liên quan nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận tường minh. Phải là true khi gọi tool này sau khi người dùng đã đồng ý."}
      required: [summary]
